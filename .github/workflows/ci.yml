name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sh scripts/fetch-test-roms.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - run: cargo build --release -p pipit-wasm --target wasm32-unknown-unknown

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          # The smoke test drives Chrome over a WebSocket, a Node 22+ global.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install wasm-bindgen-cli at the version in Cargo.lock
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | tail -1 | sed 's/version = "\(.*\)"/\1/')
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - run: sh scripts/fetch-test-roms.sh
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Smoke test in headless Chrome
        run: |
          (cd web && npx vite preview --port 4173 --strictPort &)
          sleep 3
          node scripts/smoke-web.mjs tests/roms/gba-tests/ppu/hello.gba http://localhost:4173 build/smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshot
          path: build/smoke.png
